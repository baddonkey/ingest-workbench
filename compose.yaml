# Local development only. No production deployment is implied.
x-kost-environment: &kost-environment
  KOSTVAL_ENABLED: ${KOSTVAL_ENABLED:-false}
  KOSTVAL_URL: ${KOSTVAL_URL:-http://host.containers.internal:8001}
  KOSTVAL_API_KEY: ${KOSTVAL_API_KEY:-}
  KOSTVAL_LANGUAGE: ${KOSTVAL_LANGUAGE:-de}
  KOSTVAL_POLL_SECONDS: ${KOSTVAL_POLL_SECONDS:-5}
  KOSTVAL_DEADLINE_SECONDS: ${KOSTVAL_DEADLINE_SECONDS:-3600}
services:
  postgres:
    profiles: [persistence]
    image: docker.io/library/postgres:18.3-alpine
    environment:
      POSTGRES_USER: archive_dev
      POSTGRES_DB: archive_dev
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:-postgres-local-only}
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U archive_dev -d archive_dev"]
      interval: 10s
      timeout: 5s
      retries: 6
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-local-admin-change-me}
      KC_HOSTNAME: http://localhost:8080
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./config/realm.json:/opt/keycloak/data/import/realm.json:ro,Z
      - keycloak-data:/opt/keycloak/data
  postgres-api:
    profiles: [persistence]
    image: localhost/ingest-workbench-api:latest
    build:
      context: .
      dockerfile: backend/Containerfile
    environment:
      <<: *kost-environment
      DATA_DIR: /data
      SCHEMA_DIR: /application/schemas
      DATABASE_URL: ${POSTGRES_API_DATABASE_URL:-postgresql+psycopg://archive_dev:postgres-local-only@postgres:5432/archive_dev}
      OIDC_ISSUER: http://localhost:8080/realms/ingest-workbench
      OIDC_JWKS_URL: http://keycloak:8080/realms/ingest-workbench/protocol/openid-connect/certs
      OIDC_ALLOWED_CLIENTS: archive-workbench
    ports: ["127.0.0.1:${POSTGRES_API_PORT:-8001}:8000"]
    volumes:
      - archive-postgres-data:/data
      - ./config/aip-policy.json:/application/aip-policy.json:ro,Z
    depends_on: [postgres,keycloak]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  api:
    image: localhost/ingest-workbench-api:latest
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    build:
      context: .
      dockerfile: backend/Containerfile
    environment:
      <<: *kost-environment
      DATA_DIR: /data
      SCHEMA_DIR: /application/schemas
      OIDC_ISSUER: http://localhost:8080/realms/ingest-workbench
      OIDC_JWKS_URL: http://keycloak:8080/realms/ingest-workbench/protocol/openid-connect/certs
      OIDC_ALLOWED_CLIENTS: archive-workbench
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - archive-data:/data
      - ./config/aip-policy.json:/application/aip-policy.json:ro,Z
    depends_on: [keycloak]
  kost-worker:
    image: localhost/ingest-workbench-api:latest
    command: [python, -m, app.kost_worker]
    restart: unless-stopped
    environment:
      <<: *kost-environment
      DATA_DIR: /data
      SCHEMA_DIR: /application/schemas
    volumes:
      - archive-data:/data
    depends_on: [api]
    healthcheck:
      test: [CMD, python, -m, app.kost_worker, --check]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  postgres-kost-worker:
    profiles: [persistence]
    image: localhost/ingest-workbench-api:latest
    command: [python, -m, app.kost_worker]
    restart: unless-stopped
    environment:
      <<: *kost-environment
      DATA_DIR: /data
      SCHEMA_DIR: /application/schemas
      DATABASE_URL: ${POSTGRES_API_DATABASE_URL:-postgresql+psycopg://archive_dev:postgres-local-only@postgres:5432/archive_dev}
    volumes:
      - archive-postgres-data:/data
    depends_on: [postgres-api]
    healthcheck:
      test: [CMD, python, -m, app.kost_worker, --check]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  workbench:
    image: localhost/ingest-workbench:latest
    build:
      context: ./frontend
      dockerfile: Containerfile
    command: [npm, start, --, --poll, "1000"]
    ports: ["127.0.0.1:4200:4200"]
    volumes:
      - ./frontend/src:/application/src:ro,Z
      - ./frontend/public:/application/public:ro,Z
    depends_on: [api]
volumes:
  archive-postgres-data:
  postgres-data:
  keycloak-data:
  archive-data:
